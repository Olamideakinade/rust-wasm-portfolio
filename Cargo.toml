[package]
name = "rust-wasm-portfolio"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
web-sys = {"version" = "0.3", features = ["Document", "Window", "HtmlCanvasElement", "CanvasRenderingContext2d", "Element", "console"]}
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde-json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
